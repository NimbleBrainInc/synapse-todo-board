[project]
name = "synapse-todo-board"
version = "0.3.1"
description = "Kanban-style task manager with table and drag-and-drop board views"
requires-python = ">=3.13"
dependencies = [
    "fastmcp==3.1.1",
    "jsonschema>=4.26.0",
    "python-ulid>=3.1.0",
    "uvicorn>=0.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_todo_board"]
only-include = ["src/synapse_todo_board", "schemas", "skills", "seed", "ui/dist"]
artifacts = ["ui/dist/**"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"schemas" = "synapse_todo_board/assets/schemas"
"skills" = "synapse_todo_board/assets/skills"
"seed" = "synapse_todo_board/assets/seed"
"ui/dist" = "synapse_todo_board/assets/ui/dist"

[tool.hatch.build.targets.wheel.force-include]
"context.md" = "synapse_todo_board/assets/context.md"
"SKILL.md" = "synapse_todo_board/assets/SKILL.md"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
